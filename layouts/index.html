{{ define "main" }}
  <div id="eq-app" class="eq-search-page" data-items-url="{{ .Site.Params.dataPath | relURL }}">
    <form id="filters" class="filters">
      <div class="search-row">
        <label for="search">Search items</label>
        <input id="search" type="search" autocomplete="off" placeholder="Name, keyword, VNUM, stat, or flag">
        <div class="search-actions">
          <button class="primary-button" type="submit">Find</button>
          <button type="reset" class="reset-button">Reset</button>
          <button type="button" class="share-button">Copy link</button>
          <a class="download-button" href="{{ .Site.Params.dataPath | relURL }}" download="slothmud-eq-items.json">Download .json</a>
        </div>
        <span class="share-status" aria-live="polite"></span>
      </div>

      <div class="filter-panels">
      <details class="filter-group class-level-filter" open>
        <summary>Class levels</summary>
        <div class="filter-group-content">
          <div class="level-grid">
            <label>Wa<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Wa"></label>
            <label>Th<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Th"></label>
            <label>Ma<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Ma"></label>
            <label>Cl<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Cl"></label>
            <label>Dr<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Dr"></label>
            <label>Mo<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Mo"></label>
            <label>Ba<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Ba"></label>
            <label>Ne<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Ne"></label>
            <label>Av<input inputmode="numeric" pattern="[0-9]*" type="number" min="0" max="99" data-level="Av"></label>
          </div>
        </div>
      </details>

      <details class="filter-group type-filter" open>
        <summary>Type</summary>
        <div class="filter-group-content">
          <div class="type-columns">
            <section class="type-section worn-types">
              <h3>Worn</h3>
              <div class="choice-grid type-choice-grid">
                <label><input type="checkbox" data-category="light"><span>Light</span></label>
                <label><input type="checkbox" data-category="finger"><span>Finger</span></label>
                <label><input type="checkbox" data-category="neck"><span>Neck</span></label>
                <label><input type="checkbox" data-category="body"><span>Body</span></label>
                <label><input type="checkbox" data-category="head"><span>Head</span></label>
                <label><input type="checkbox" data-category="legs"><span>Legs</span></label>
                <label><input type="checkbox" data-category="feet"><span>Feet</span></label>
                <label><input type="checkbox" data-category="hands"><span>Hands</span></label>
                <label><input type="checkbox" data-category="arms"><span>Arms</span></label>
                <label><input type="checkbox" data-category="shield"><span>Shield</span></label>
                <label><input type="checkbox" data-category="robe"><span>About</span></label>
                <label><input type="checkbox" data-category="waist"><span>Waist</span></label>
                <label><input type="checkbox" data-category="wrist"><span>Wrist</span></label>
                <label><input type="checkbox" data-category="held"><span>Held</span></label>
                <label><input type="checkbox" data-category="ammo"><span>Ammo</span></label>
                <label><input type="checkbox" data-category="instrument"><span>Instrument</span></label>
              </div>
            </section>
            <div class="type-right-column">
              <section class="type-section weapon-types">
                <h3>Weapons</h3>
                <div class="choice-grid type-choice-grid">
                  <label><input type="checkbox" data-weapon-subtype="1 Handed Weapons"><span>1-handed</span></label>
                  <label><input type="checkbox" data-weapon-subtype="2 Handed Weapons"><span>2-handed</span></label>
                  <label><input type="checkbox" data-weapon-subtype="Fire Weapons"><span>Fire</span></label>
                  <label><input type="checkbox" data-weapon-subtype="Throw-only Weapons"><span>Throw-only</span></label>
                </div>
              </section>
              <section class="type-section misc-types">
                <div class="choice-grid misc-equipment-grid">
                  <label><input type="checkbox" data-category="book"><span>Books</span></label>
                  <label><input type="checkbox" data-category="clasp"><span>Clasps</span></label>
                  <label><input type="checkbox" data-category="rune"><span>Runes</span></label>
                  <label><input type="checkbox" data-category="potion"><span>Potions</span></label>
                  <label><input type="checkbox" data-category="container"><span>Containers</span></label>
                  <label><input type="checkbox" data-category="liquid"><span>Liquid</span></label>
                  <label><input type="checkbox" data-category="scroll"><span>Scrolls</span></label>
                  <label><input type="checkbox" data-category="wand"><span>Wands</span></label>
                  <label><input type="checkbox" data-category="key"><span>Keys</span></label>
                  <label><input type="checkbox" data-category="note"><span>Notes</span></label>
                  <label><input type="checkbox" data-category="treasure"><span>Treasures</span></label>
                </div>
              </section>
            </div>
          </div>
        </div>
      </details>

      <details class="filter-group resource-filter" open>
        <summary>Traits</summary>
        <div class="filter-group-content">
          <section class="stat-group resource-stats">
            <div class="choice-grid stats-grid">
              <label><input type="checkbox" data-stat="Mp"><span>Mana</span></label>
              <label><input type="checkbox" data-stat="Mr"><span>Mana regen</span></label>
              <label><input type="checkbox" data-stat="Hp"><span>HP</span></label>
              <label><input type="checkbox" data-stat="Hpr"><span>HP regen</span></label>
              <label><input type="checkbox" data-stat="Mv"><span>Move</span></label>
              <label><input type="checkbox" data-stat="Mvr"><span>Move regen</span></label>
            </div>
          </section>
          <section class="stat-group resource-flags item-flags-filter">
            <div class="tri-grid">
              <label class="tri-filter" data-tristate="forge">
                <input type="checkbox" class="tri-state-checkbox" data-state="any" aria-label="Forge: Any">
                <span>Forge</span>
              </label>
              <label class="tri-filter" data-tristate="personal">
                <input type="checkbox" class="tri-state-checkbox" data-state="any" aria-label="Personal: Any">
                <span>Personal</span>
              </label>
              <label class="tri-filter" data-tristate="shapeshift">
                <input type="checkbox" class="tri-state-checkbox" data-state="any" aria-label="Shapeshift: Any">
                <span>Shapeshift</span>
              </label>
              <label class="tri-filter" data-tristate="temporary">
                <input type="checkbox" class="tri-state-checkbox" data-state="any" aria-label="Temporary: Any">
                <span>Temporary</span>
              </label>
              <label class="tri-filter" data-tristate="drachma">
                <input type="checkbox" class="tri-state-checkbox" data-state="any" aria-label="Drachma: Any">
                <span>Drachma</span>
              </label>
              <label class="tri-filter" data-tristate="hidden">
                <input type="checkbox" class="tri-state-checkbox" data-state="no" aria-label="Hidden: Excluded">
                <span>Hidden</span>
              </label>
            </div>
          </section>
        </div>
      </details>

      <details class="filter-group damage-filter" open>
        <summary>Combat/Spell</summary>
        <div class="filter-group-content">
          <section class="stat-group">
            <div class="choice-grid stats-grid">
              <label><input type="checkbox" data-stat="Dam"><span>Dam</span></label>
              <label><input type="checkbox" data-stat="Hit"><span>Hit</span></label>
              <label><input type="checkbox" data-stat="HandDam"><span>Hand damage</span></label>
              <label><input type="checkbox" data-stat="WeaponDam"><span>Weapon Damage</span></label>
              <label><input type="checkbox" data-stat="StabDam"><span>Stab Damage</span></label>
              <label><input type="checkbox" data-stat="Pierce"><span>Pierce</span></label>
              <label><input type="checkbox" data-stat="KickDam"><span>Kick damage</span></label>
              <label><input type="checkbox" data-stat="FlailDam"><span>Flail damage</span></label>
              <label><input type="checkbox" data-stat="CircleDam"><span>Circle damage</span></label>
            </div>
          </section>
          <section class="stat-group water-breath-stat">
            <div class="choice-grid stats-grid">
              <label><input type="checkbox" data-stat="WaterBreathing"><span>Water breath</span></label>
            </div>
          </section>
        </div>
      </details>

      <details class="filter-group attribute-filter" open>
        <summary>Stat</summary>
        <div class="filter-group-content">
          <div class="attribute-grid">
            <div class="attribute-set">
              <label><input type="checkbox" data-stat="Str"><span>Str</span></label>
              <label><input type="checkbox" data-stat="Int"><span>Int</span></label>
              <label><input type="checkbox" data-stat="Wis"><span>Wis</span></label>
              <label><input type="checkbox" data-stat="Dex"><span>Dex</span></label>
              <label><input type="checkbox" data-stat="Con"><span>Con</span></label>
            </div>
            <div class="attribute-set max-attribute-set">
              <label><input type="checkbox" data-stat="MaxStr"><span>Max Str</span></label>
              <label><input type="checkbox" data-stat="MaxInt"><span>Max Int</span></label>
              <label><input type="checkbox" data-stat="MaxWis"><span>Max Wis</span></label>
              <label><input type="checkbox" data-stat="MaxDex"><span>Max Dex</span></label>
              <label><input type="checkbox" data-stat="MaxCon"><span>Max Con</span></label>
            </div>
          </div>
        </div>
      </details>

      <details class="filter-group bonus-filter" open>
        <summary>Bonus/Save</summary>
        <div class="filter-group-content">
          <section class="stat-group">
            <div class="choice-grid stats-grid">
              <label><input type="checkbox" data-stat="Spellbonus"><span>Spell Bonus</span></label>
              <label><input type="checkbox" data-stat="Healbonus"><span>Heal Bonus</span></label>
              <label><input type="checkbox" data-stat="UndeadControl"><span>Undead Control</span></label>
              <label><input type="checkbox" data-stat="Charisma"><span>Charisma</span></label>
              <label><input type="checkbox" data-stat="Shock"><span>System Shock</span></label>
              <label><input type="checkbox" data-stat="ReduceDam"><span>Reduce Damage</span></label>
            </div>
          </section>
          <section class="stat-group saving-stats">
            <div class="choice-grid stats-grid">
              <label><input type="checkbox" data-stat="SavingPara"><span>SAVING_PARA</span></label>
              <label><input type="checkbox" data-stat="SavingPoison"><span>SAVING_POISON</span></label>
              <label><input type="checkbox" data-stat="SavingPetri"><span>SAVING_PETRI</span></label>
              <label><input type="checkbox" data-stat="SavingBreath"><span>SAVING_BREATH</span></label>
              <label><input type="checkbox" data-stat="SpellSaves"><span>SAVING_SPELL</span></label>
            </div>
          </section>
        </div>
      </details>

      </div>
    </form>

    <section class="results" aria-live="polite">
      <div class="results-heading">
        <div>
          <h2>Results</h2>
          <p id="result-count" class="result-count">Loading item data…</p>
        </div>
        <div class="sort-control">
          <span>Sort</span>
          <div class="segment-control sort-segments" role="radiogroup" aria-label="Sort results">
            <label><input type="radio" name="sort" value="ac" checked><span>AC</span></label>
            <label><input type="radio" name="sort" value="dam"><span>DAM</span></label>
            <label><input type="radio" name="sort" value="mana"><span>MA</span></label>
            <label><input type="radio" name="sort" value="mr"><span>MR</span></label>
          </div>
        </div>
      </div>
      <div id="results-list"></div>
      <p id="no-results" class="no-results" hidden>No items match these filters.</p>
      <p id="load-error" class="load-error" role="alert" hidden></p>
    </section>
    <p class="eq-data-note">Static snapshot of SlothMUD EQ data. Search includes exported item fields and linked mob/area names where available.</p>
  </div>
  <script src="{{ "js/app.js" | relURL }}" defer></script>
{{ end }}
